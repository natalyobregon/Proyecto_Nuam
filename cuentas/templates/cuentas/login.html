{% extends 'base.html' %}
{% block titulo %}Inicio de sesión{% endblock %}
{% block clase_body %}pagina-login{% endblock %}
{% block barra %}{% endblock %}
{% block contenido %}
<div class="card tarjeta-login shadow">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <div class="logo-nuam" role="img" aria-label="nuam">nuam</div>
      <h1 class="logo-sub fw-normal mt-1 mb-0">Inicio de sesión</h1>
    </div>

    <div aria-live="assertive">
      {% if error %}
      <div class="alert alert-danger py-2" role="alert" id="error-login">{{ error }}</div>
      {% endif %}
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">Usuario</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}"
               class="form-control{% if error %} is-invalid{% endif %}"
               value="{{ form.username.value|default_if_none:'' }}" maxlength="150"
               autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required
               {% if error %}aria-describedby="error-login"{% endif %}>
      </div>

      <div class="mb-4">
        <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">Contraseña</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}"
               class="form-control{% if error %} is-invalid{% endif %}"
               maxlength="128" autocomplete="current-password" required
               {% if error %}aria-describedby="error-login"{% endif %}>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
